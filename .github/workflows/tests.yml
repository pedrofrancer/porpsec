name: testes

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prospectplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prospectplatform/backend/requirements.txt
      - name: Dependencias
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Testes
        run: python -m pytest tests -q
