rules:
  - name: sem_site
    description: "Empresa não possui website"
    condition_field: "website"
    condition_operator: "is_empty"
    suggested_solution: "Website Institucional"
    priority: "alta"

  - name: site_sem_whatsapp
    description: "Website sem botão/link de WhatsApp visível"
    condition_field: "has_whatsapp"
    condition_operator: "is_false"
    suggested_solution: "Integração WhatsApp"
    priority: "media"

  - name: sem_agendamento_barbearia
    description: "Barbearia sem agendamento online"
    condition_field: "has_scheduling"
    condition_operator: "is_false"
    required_categories: ["barbearia"]
    suggested_solution: "Sistema de Agendamento"
    priority: "alta"

  - name: sem_agendamento_salao
    description: "Salão sem agendamento online"
    condition_field: "has_scheduling"
    condition_operator: "is_false"
    required_categories: ["salao-de-beleza"]
    suggested_solution: "Sistema de Agendamento"
    priority: "alta"

  - name: sem_agendamento_clinica
    description: "Clínica sem agendamento online"
    condition_field: "has_scheduling"
    condition_operator: "is_false"
    required_categories: ["clinica"]
    suggested_solution: "Sistema de Agendamento"
    priority: "alta"

  - name: sem_agendamento_academia
    description: "Academia sem agendamento online"
    condition_field: "has_scheduling"
    condition_operator: "is_false"
    required_categories: ["academia"]
    suggested_solution: "Sistema de Agendamento"
    priority: "alta"

  - name: site_lento
    description: "Website com tempo de resposta > 3s"
    condition_field: "response_time_ms"
    condition_operator: "gt"
    condition_value: "3000"
    suggested_solution: "Otimização de Performance"
    priority: "media"

  - name: meta_inadequada
    description: "Meta tags ausentes ou com conteúdo insuficiente"
    condition_field: "meta_title_length"
    condition_operator: "lt"
    condition_value: "10"
    suggested_solution: "Otimização SEO Básica"
    priority: "media"

  - name: sem_viewport_mobile
    description: "Site não responsivo (sem meta viewport)"
    condition_field: "has_viewport"
    condition_operator: "is_false"
    suggested_solution: "Design Responsivo"
    priority: "alta"

  - name: instagram_inativo
    description: "Instagram sem publicações nos últimos 30 dias"
    condition_field: "instagram_active"
    condition_operator: "is_false"
    suggested_solution: "Gestão de Redes Sociais"
    priority: "media"

  - name: google_business_incompleto
    description: "Perfil do Google Business incompleto"
    condition_field: "google_business_complete"
    condition_operator: "is_false"
    suggested_solution: "Otimização Google Business"
    priority: "alta"

  - name: blog_parado
    description: "Blog/site sem conteúdo recente (6+ meses)"
    condition_field: "blog_freshness_days"
    condition_operator: "gt"
    condition_value: "180"
    suggested_solution: "Marketing de Conteúdo"
    priority: "baixa"
